name: Comic

on:
  workflow_dispatch:
    inputs:
      id:
        required: false
        default: ''
      start:
        required: false
        default: ''
      end:
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  TZ: Asia/Tokyo

defaults:
  run:
    working-directory: ./comic

jobs:
  radiko:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build and Download
        run: cargo run -- ${{ github.event.inputs.id }} ${{ github.event.inputs.start }} ${{ github.event.inputs.end }}

      - name: Collect
        run: |
          mkdir -p comic
          mv ^[0-9]+ comic/ || true
          zip -r comic.zip comic

      - name: Upload
        uses: willo32/google-drive-upload-action@v1
        with:
          target: comic.zip
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
