name: Comic

on:
  workflow_dispatch:
    inputs:
      id:
        required: false
        default: ''
      start:
        required: false
        default: ''
      end:
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  TZ: Asia/Tokyo

defaults:
  run:
    working-directory: ./comic

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build and Download
        run: cargo run -- ${{ github.event.inputs.id }} ${{ github.event.inputs.start }} ${{ github.event.inputs.end }}

      - name: Collect
        run: |
          mkdir -p comic
          for d in [0-9]*; do
            [ -d "$d" ] && mv "$d" comic/
          done
          zip -r comic.zip comic

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: upload
          path: comic/comic/
          retention-days: 1
