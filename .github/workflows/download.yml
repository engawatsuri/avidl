name: Download

on:
  workflow_dispatch:
    inputs:
      weekday:
        description: 'weekday'
        required: false
        default: ''
  schedule:
    - cron: '0 18 * * *'

env:
  CARGO_TERM_COLOR: always
  TZ: Asia/Tokyo

jobs:
  radiko:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          pip3 install yt-dlp yt-dlp-rajiko

      - name: Build and Download
        run: cargo run -- ${{ github.event.inputs.weekday }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SAVING_KEY }}

      - name: Save from Google Drive
        uses: wei/rclone@v1
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_SCOPE: drive
          RCLONE_CONFIG_MYDRIVE_ROOT_FOLDER_ID: '17wZ5CRm5T1Fgfk3rtzyzO2EcBTUluzZr'
          RCLONE_CONFIG_MYDRIVE_SERVICE_ACCOUNT_BLANK: true
        with:
          args: copy *.m4a mydrive:
